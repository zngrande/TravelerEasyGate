<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>旅行社註冊 - Useful Travel</title>
    <style>
        body { font-family: "Microsoft JhengHei", sans-serif; max-width: 480px; margin: 60px auto; }
        label { display: block; margin-top: 12px; font-weight: bold; }
        input { width: 100%; padding: 8px; margin-top: 4px; box-sizing: border-box; }
        button { margin-top: 20px; padding: 10px 20px; }
    </style>
</head>
<body>
    <h1>建立旅行社帳號</h1>
    <p>註冊後會建立一個旅行社（租戶），並自動建立第一個管理員帳號。</p>
    <form method="post" th:action="@{/register}">
        <label>旅行社名稱</label>
        <input type="text" name="agencyName" required />

        <label>旅行社執照字號（選填）</label>
        <input type="text" name="licenseNo" />

        <label>聯絡電話</label>
        <input type="text" name="contactPhone" required />

        <label>管理員姓名</label>
        <input type="text" name="adminName" required />

        <label>登入帳號</label>
        <input type="text" name="account" required />

        <label>密碼</label>
        <input type="password" name="pw" required />

        <button type="submit">建立帳號</button>
    </form>
    <p><a th:href="@{/login}">已經有帳號？前往登入</a></p>
</body>
</html>
