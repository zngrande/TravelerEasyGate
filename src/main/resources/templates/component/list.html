<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>元件庫 - TRAVELER EASY GATE</title>
    <!-- Google Fonts & FontAwesome -->
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --primary-blue: #2563eb;
            --primary-purple: #8b5cf6;
            --bg-gray: #f8fafc;
            --text-dark: #1e293b;
            --text-gray: #64748b;
            --border-color: #e2e8f0;
            --sidebar-width: 200px;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'Noto Sans TC', sans-serif;
            background-color: var(--bg-gray);
            color: var(--text-dark);
            display: flex;
            min-height: 100vh;
            -webkit-font-smoothing: antialiased;
        }
        a { text-decoration: none; color: inherit; }

        /* Sidebar */
        .sidebar {
            width: var(--sidebar-width);
            background: #fff;
            border-right: 1px solid var(--border-color);
            display: flex;
            flex-direction: column;
            padding: 24px 20px;
            position: fixed;
            height: 100vh;
            z-index: 10;
        }
        .logo {
            font-size: 20px;
            font-weight: 700;
            color: var(--primary-blue);
            margin-bottom: 40px;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .logo span { font-size: 10px; color: var(--text-gray); display: block; font-weight: 400; letter-spacing: 1px; }

        .nav-menu { flex: 1; display: flex; flex-direction: column; gap: 8px; }
        .nav-item {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 12px 16px;
            border-radius: 8px;
            color: var(--text-gray);
            font-weight: 500;
            transition: all 0.2s;
        }
        .nav-item:hover { background: #f1f5f9; color: var(--text-dark); }
        .nav-item.active { background: #eff6ff; color: var(--primary-blue); font-weight: 600; }

        .help-box {
            background: #f8fafc;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 16px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            font-size: 13px;
            cursor: pointer;
            margin-bottom: 12px;
        }
        .help-box i { color: var(--primary-blue); font-size: 20px; }

        /* Main Content */
        .main-content { margin-left: var(--sidebar-width); flex: 1; padding: 32px 40px; }

        .page-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 24px; }
        .page-title { font-size: 22px; font-weight: 700; display: flex; align-items: center; gap: 10px; }
        .page-desc { font-size: 14px; color: var(--text-gray); margin-bottom: 24px; line-height: 1.5; }

        .grid-layout { display: grid; grid-template-columns: 2fr 1fr; gap: 24px; align-items: flex-start; }

        .card {
            background: #fff;
            border: 1px solid var(--border-color);
            border-radius: 10px;
            padding: 24px;
        }
        .card-header {
            font-size: 16px;
            font-weight: 700;
            margin-bottom: 16px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        /* Table */
        .table-container { border: 1px solid var(--border-color); border-radius: 12px; overflow: hidden; }
        table { width: 100%; border-collapse: collapse; text-align: left; font-size: 14px; }
        th { background: #f8fafc; padding: 14px 16px; font-size: 13px; color: var(--text-gray); font-weight: 500; border-bottom: 1px solid var(--border-color); }
        td { padding: 14px 16px; border-bottom: 1px solid var(--border-color); vertical-align: middle; }
        tr:last-child td { border-bottom: none; }

        .tag {
            display: inline-block;
            padding: 3px 10px;
            border-radius: 6px;
            font-size: 12px;
            font-weight: 600;
            background: #eff6ff;
            color: var(--primary-blue);
        }

        /* Form */
        .form-group { margin-bottom: 16px; }
        .form-label { display: block; font-size: 13px; font-weight: 600; color: #334155; margin-bottom: 6px; }
        .form-control {
            width: 100%; padding: 10px 12px; font-size: 14px;
            border: 1px solid var(--border-color); border-radius: 8px; outline: none; background: #fff;
            transition: all 0.15s;
        }
        .form-control:focus { border-color: var(--primary-blue); box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.1); }
        .btn-submit {
            width: 100%; padding: 9px; background: var(--primary-blue);
            color: #fff; border: none; border-radius: 6px; font-size: 13px; font-weight: 500; cursor: pointer;
            display: inline-flex; align-items: center; justify-content: center; gap: 6px;
            transition: background 0.15s; margin-top: 4px;
        }
        .btn-submit:hover { background: #1d4ed8; }

        /* 錯誤警告區塊 */
        .alert-error {
            background: #fef2f2; color: #991b1b; padding: 12px 18px; border-radius: 10px;
            margin-bottom: 20px; font-size: 13.5px; border: 1px solid #fecaca;
            display: flex; align-items: center; gap: 8px;
        }
        .btn-icon-delete { background: none; border: none; cursor: pointer; color: var(--text-gray); font-size: 14px; padding: 4px 6px; border-radius: 6px; }
        .btn-icon-delete:hover { color: #dc2626; background: #fef2f2; }
    </style>
</head>
<body>

<!-- Sidebar -->
<aside th:replace="~{fragments/sidebar :: sidebar(active='component', userName=${session.name})}"></aside>

<!-- Main Content -->
<main class="main-content">
    <div class="page-header">
        <div class="page-title">
            <i class="fa-solid fa-layer-group" style="color: var(--primary-blue);"></i> 元件庫管理
        </div>
        <a th:href="@{/agency/dashboard}" style="color: var(--text-gray); font-size: 14px; font-weight: 500;">
            <i class="fa-solid fa-arrow-left"></i> 返回行程列表
        </a>
    </div>

    <p class="page-desc">把航班、遊覽車、導遊等常用資源建成標準元件，掛到報價元件後會自動加總成本與售價。</p>

    <div th:if="${deleteError}" class="alert-error">
        <i class="fa-solid fa-triangle-exclamation"></i>
        <span th:text="${deleteError}"></span>
    </div>

    <div class="grid-layout">
        <!-- 左側：現有元件清單 -->
        <div class="card">
            <div class="card-header">
                <i class="fa-solid fa-list" style="color: var(--primary-blue);"></i> 現有元件列表
            </div>

            <div class="table-container" th:if="${!components.isEmpty()}">
                <table>
                    <thead>
                    <tr>
                        <th>名稱</th>
                        <th>類型</th>
                        <th>計費方式</th>
                        <th>預設單價 (TWD)</th>
                        <th>說明</th>
                        <th></th>
                    </tr>
                    </thead>
                    <tbody>
                    <th:block th:each="c : ${components}">
                    <!-- 檢視模式：一般顯示的資料列 -->
                    <tr th:id="'view-' + ${c.CPID}">
                        <td><strong th:text="${c.name}"></strong></td>
                        <td><span class="tag" th:text="${componentTypeLabels.get(c.type)} ?: ${c.type}"></span></td>
                        <td>
                            <span class="tag" style="background:#f3e8ff; color:#7e22ce;"
                                  th:text="${c.costType == 'FIXED_GROUP'} ? '全團固定一口價' : '按人頭'"></span>
                        </td>
                        <td style="font-weight:600; color:#0f172a;" th:text="${c.defaultPrice != null ? 'NT$ ' + c.defaultPrice : '-'}"></td>
                        <td style="color: var(--text-gray);" th:text="${c.description != null ? c.description : '-'}"></td>
                        <td style="white-space:nowrap;">
                            <button type="button" class="btn-icon-delete" title="編輯" th:onclick="'toggleComponentEdit(' + ${c.CPID} + ')'">
                                <i class="fa-solid fa-pen"></i>
                            </button>
                            <form method="post" th:action="@{'/component/' + ${c.CPID} + '/delete'}" style="display:inline;"
                                  onsubmit="return confirm('確定要刪除這個元件嗎？');">
                                <button type="submit" class="btn-icon-delete" title="刪除"><i class="fa-solid fa-trash"></i></button>
                            </form>
                        </td>
                    </tr>
                    <!-- 編輯模式：預設隱藏，點「編輯」後切換成這一列的表單，「元件庫內容要可以編輯」 -->
                    <tr th:id="'edit-' + ${c.CPID}" style="display:none; background:#f8fafc;">
                        <td colspan="6">
                            <form method="post" th:action="@{'/component/' + ${c.CPID} + '/edit'}"
                                  style="display:flex; gap:10px; align-items:center; flex-wrap:wrap; padding:6px 0;">
                                <select name="type" class="form-control" style="width:160px;">
                                    <option th:each="t : ${componentTypeLabels}" th:value="${t.key}" th:text="${t.value}"
                                            th:selected="${t.key == c.type}"></option>
                                </select>
                                <select name="costType" class="form-control" style="width:150px;">
                                    <option value="PER_PAX" th:selected="${c.costType != 'FIXED_GROUP'}">按人頭</option>
                                    <option value="FIXED_GROUP" th:selected="${c.costType == 'FIXED_GROUP'}">全團固定一口價</option>
                                </select>
                                <input type="text" name="name" class="form-control" th:value="${c.name}"
                                       style="flex:1; min-width:140px;" required />
                                <input type="number" step="0.01" name="defaultPrice" class="form-control" th:value="${c.defaultPrice}"
                                       placeholder="預設單價" style="width:130px;" />
                                <input type="text" name="description" class="form-control" th:value="${c.description}"
                                       placeholder="說明（選填）" style="flex:1; min-width:160px;" />
                                <button type="submit" class="btn-submit" style="width:auto; padding:9px 16px;">
                                    <i class="fa-solid fa-check"></i> 儲存
                                </button>
                                <button type="button" class="btn-submit" style="width:auto; padding:9px 16px; background:#94a3b8;"
                                        th:onclick="'toggleComponentEdit(' + ${c.CPID} + ')'">取消</button>
                            </form>
                        </td>
                    </tr>
                    </th:block>
                    </tbody>
                </table>
            </div>

            <div th:if="${components.isEmpty()}" style="padding: 40px 20px; text-align: center; color: var(--text-gray); font-size: 14px;">
                目前還沒有建立任何報價元件，請利用右側表單新增。
            </div>
        </div>

        <!-- 右側：新增元件表單 -->
        <div class="card">
            <div class="card-header">
                <i class="fa-solid fa-plus-circle" style="color: var(--primary-blue);"></i> 新增元件
            </div>

            <form class="new-form" method="post" th:action="@{/component/new}">
                <div class="form-group">
                    <label class="form-label">類型</label>
                    <select name="type" class="form-control" required>
                        <option th:each="t : ${componentTypeLabels}" th:value="${t.key}" th:text="${t.value}"></option>
                    </select>
                </div>

                <div class="form-group">
                    <label class="form-label">計費方式</label>
                    <select name="costType" class="form-control">
                        <option value="PER_PAX" selected>按人頭</option>
                        <option value="FIXED_GROUP">全團固定一口價</option>
                    </select>
                </div>

                <div class="form-group">
                    <label class="form-label">名稱</label>
                    <input type="text" name="name" class="form-control" placeholder="例：桃園-花蓮 台鐵自強號" required />
                </div>

                <div class="form-group">
                    <label class="form-label">預設單價 (TWD)</label>
                    <input type="number" step="0.01" name="defaultPrice" class="form-control" placeholder="例：500" />
                </div>

                <div class="form-group">
                    <label class="form-label">說明（選填）</label>
                    <input type="text" name="description" class="form-control" placeholder="備註說明..." />
                </div>

                <button type="submit" class="btn-submit">
                    <i class="fa-solid fa-plus"></i> 新增元件
                </button>
            </form>
        </div>
    </div>
</main>

<script>
    // 「編輯」按鈕：切換這一列的檢視/編輯模式，不用另外跳頁或跳出視窗
    function toggleComponentEdit(id) {
        var viewRow = document.getElementById('view-' + id);
        var editRow = document.getElementById('edit-' + id);
        if (!viewRow || !editRow) return;
        var isEditing = editRow.style.display !== 'none';
        viewRow.style.display = isEditing ? '' : 'none';
        editRow.style.display = isEditing ? 'none' : '';
    }
</script>

</body>
</html>
