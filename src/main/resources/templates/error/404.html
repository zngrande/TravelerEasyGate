<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>找不到頁面 - TRAVELER EASY GATE</title>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --primary-blue: #2563eb;
            --bg-gray: #f8fafc;
            --text-dark: #1e293b;
            --text-gray: #64748b;
            --border-color: #e2e8f0;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'Noto Sans TC', sans-serif; background-color: var(--bg-gray); color: var(--text-dark);
            display: flex; align-items: center; justify-content: center; min-height: 100vh; padding: 24px;
        }
        a { text-decoration: none; }
        .error-card {
            width: 100%; max-width: 460px; background: #fff; text-align: center;
            border: 1px solid var(--border-color); border-radius: 16px; padding: 44px 36px;
            box-shadow: 0 4px 6px -1px rgba(0,0,0,0.03);
        }
        .logo { font-size: 20px; font-weight: 700; color: var(--primary-blue); display: flex; align-items: center; justify-content: center; gap: 10px; margin-bottom: 32px; }
        .logo span { font-size: 10px; color: var(--text-gray); display: block; font-weight: 400; letter-spacing: 1px; }
        .error-icon {
            width: 72px; height: 72px; border-radius: 50%; background: #eff6ff; color: var(--primary-blue);
            display: flex; align-items: center; justify-content: center; font-size: 30px; margin: 0 auto 20px;
        }
        h1 { font-size: 19px; font-weight: 700; margin-bottom: 10px; }
        p { font-size: 13.5px; color: var(--text-gray); line-height: 1.7; margin-bottom: 28px; }
        .btn-home {
            display: inline-flex; align-items: center; gap: 8px;
            background: var(--primary-blue); color: #fff; font-size: 13.5px; font-weight: 600;
            padding: 11px 22px; border-radius: 8px;
        }
        .btn-home:hover { background: #1d4ed8; }
    </style>
</head>
<body>

<div class="error-card">
    <div class="logo">
        <i class="fa-regular fa-compass"></i>
        <div>TEG<span>TRAVELER EASY GATE</span></div>
    </div>
    <div class="error-icon"><i class="fa-regular fa-map"></i></div>
    <h1>找不到這個頁面</h1>
    <p>你要找的頁面不存在，可能是網址打錯了，或這個頁面已經被移除。</p>
    <a class="btn-home" th:href="@{/agency/dashboard}"><i class="fa-solid fa-house"></i> 回首頁</a>
</div>

</body>
</html>
