<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TRAVELER EASY GATE</title>
    <!-- 引入 Google Fonts & FontAwesome 讓圖示與字體更好看 -->
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --primary-blue: #2563eb;
            --primary-purple: #8b5cf6;
            --bg-gray: #f8fafc;
            --text-dark: #1e293b;
            --text-gray: #64748b;
            --border-color: #e2e8f0;
            --sidebar-width: 200px;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'Noto Sans TC', sans-serif; background-color: var(--bg-gray); color: var(--text-dark); display: flex; min-height: 100vh; }
        a { text-decoration: none; color: inherit; }

        /* Main Content Styles */
        .main-content { margin-left: var(--sidebar-width); flex: 1; padding: 32px 40px; }

        /* Header */
        .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 24px; }
        .greeting { font-size: 22px; font-weight: 700; }
        .user-profile { display: flex; align-items: center; gap: 10px; background: #fff; padding: 8px 16px; border-radius: 20px; border: 1px solid var(--border-color); font-size: 14px; font-weight: 500; cursor: pointer;}

        /* Hero Banner：背景改成素材庫圖片循環撥放 (見下方 .hero-bg-layer)
           版面改成左右並排: 左邊維持原本的標題/按鈕, 右邊放三張統計卡片由上往下排 */
        .hero-banner { position: relative; overflow: hidden; border-radius: 16px; padding: 48px; color: #fff; margin-bottom: 32px; display: flex; align-items: center; justify-content: space-between; gap: 40px; }
        .hero-bg-layer { position: absolute; inset: 0; background-size: cover; background-position: center; opacity: 0; transition: opacity 1.4s ease-in-out; z-index: 0; }
        .hero-bg-layer.active { opacity: 1; }
        .hero-overlay { position: absolute; inset: 0; background: linear-gradient(rgba(0, 0, 0, 0.45), rgba(0, 0, 0, 0.45)); z-index: 1; }
        .hero-content { position: relative; z-index: 2; }
        .hero-banner h2 { font-size: 28px; margin-bottom: 8px; }
        .hero-banner p { font-size: 15px; margin-bottom: 24px; opacity: 0.9; }
        .btn-primary { background: var(--primary-blue); color: #fff; padding: 9px 18px; border-radius: 6px; font-weight: 500; font-size: 13px; display: inline-flex; align-items: center; gap: 8px; border: none; cursor: pointer; }
        .btn-primary:hover { background: #1d4ed8; }

        /* Hero 右側的統計卡片: 圖示在最左邊, 接著是行程名稱、數量, 排成一橫排 (不是原本圖示在右側、標題數字疊在一起的樣式),
           這樣卡片高度變矮, 三張疊起來的 .hero-stats 總高度才不會把整個 Banner 撐得比原本高太多 */
        .hero-stats { position: relative; z-index: 2; display: flex; flex-direction: column; gap: 10px; flex-shrink: 0; }
        .hero-stats .stat-card { min-width: 190px; padding: 10px 16px; gap: 12px; justify-content: flex-start; }
        .hero-stats .stat-icon { width: 34px; height: 34px; font-size: 14px; flex-shrink: 0; }
        .hero-stats .stat-title { font-size: 12.5px; white-space: nowrap; }
        .hero-stats .stat-number { font-size: 18px; margin-left: auto; }

        /* Section Title & AI Button */
        .section-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; }
        .section-title { font-size: 18px; font-weight: 700; display: flex; align-items: center; gap: 8px; }
        .btn-ai { background: linear-gradient(135deg, #a855f7, #6366f1); color: #fff; padding: 9px 18px; border-radius: 6px; font-weight: 500; font-size: 13px; display: inline-flex; align-items: center; gap: 8px; }

        /* Stats Cards (卡片樣式共用給 Hero 右側的 .hero-stats 使用) */
        .stat-card { background: #fff; border: 1px solid var(--border-color); border-radius: 12px; padding: 20px; display: flex; justify-content: space-between; align-items: center; }
        .stat-info { display: flex; flex-direction: column; gap: 4px; }
        .stat-title { font-size: 13px; color: var(--text-gray); }
        .stat-number { font-size: 32px; font-weight: 700; color: var(--primary-blue); }
        .stat-icon { width: 48px; height: 48px; border-radius: 50%; background: #eff6ff; display: flex; align-items: center; justify-content: center; color: var(--primary-blue); font-size: 20px; }
        /* 已完成行程用綠色 (跟「完成行程」按鈕、狀態 Badge 的綠色 #16a34a 一致) */
        .stat-card:nth-child(2) .stat-icon { background: #f0fdf4; color: #16a34a; }
        .stat-card:nth-child(2) .stat-number { color: #16a34a; }
        .stat-card:nth-child(3) .stat-icon { background: #f3e8ff; color: var(--primary-purple); }
        .stat-card:nth-child(3) .stat-number { color: var(--primary-purple); }

        /* Table Styles */
        .table-container { background: #fff; border: 1px solid var(--border-color); border-radius: 12px; overflow: hidden; }
        table { width: 100%; border-collapse: collapse; text-align: left; }
        th { background: #f8fafc; padding: 16px 20px; font-size: 13px; color: var(--text-gray); font-weight: 500; border-bottom: 1px solid var(--border-color); }
        td { padding: 16px 20px; border-bottom: 1px solid var(--border-color); vertical-align: middle; font-size: 14px; }
        tr:last-child td { border-bottom: none; }

        .itinerary-cell { display: flex; align-items: center; gap: 12px; font-weight: 500; }

        .status-badge { padding: 4px 12px; border-radius: 20px; font-size: 12px; font-weight: 500; display: inline-block; }
        /* 簡易狀態顏色對應 (可依照實際需求在 Thymeleaf 中調整) */
        .status-draft { background: #eff6ff; color: var(--primary-blue); }
        .status-pending { background: #fff7ed; color: #ea580c; }
        .status-confirmed { background: #f0fdf4; color: #16a34a; }

        .actions { display: flex; align-items: center; gap: 12px; }
        .btn-text { color: var(--primary-blue); font-weight: 500; font-size: 13px; }
        .btn-icon { color: var(--text-gray); background: none; border: none; cursor: pointer; font-size: 16px; padding: 4px; }
        .btn-icon:hover { color: #ef4444; }

        .table-footer { padding: 16px; text-align: center; border-top: 1px solid var(--border-color); }
        .table-footer a { color: var(--text-gray); font-size: 13px; }

        /* Error Alert */
        .alert { background: #fee2e2; color: #991b1b; padding: 12px 16px; border-radius: 8px; margin-bottom: 24px; font-size: 14px; border: 1px solid #fca5a5; }
    </style>
</head>
<body>

<!-- Sidebar -->
<aside th:replace="~{fragments/sidebar :: sidebar(active='itinerary', userName=${session.name})}"></aside>

<!-- Main Content -->
<main class="main-content">
    <!-- Header -->
    <header class="header">

    </header>

    <!-- 錯誤訊息提示區 -->
    <div th:if="${deleteError}" class="alert" th:text="${deleteError}"></div>

    <!-- Hero Banner：背景使用「素材庫」圖片循環撥放，見頁尾 initHeroCarousel()
         右側放三張統計卡片 (進行中行程 / 已完成行程 / 素材庫圖片), 由上往下排 -->
    <div class="hero-banner">
        <div class="hero-bg-layer active" id="heroBgLayer0"></div>
        <div class="hero-bg-layer" id="heroBgLayer1"></div>
        <div class="hero-overlay"></div>
        <div class="hero-content">
            <h2>讓每一段旅程，都清楚而精彩</h2>
            <p>專業的行程管理工具，讓規劃更高效，執行更順暢。</p>
            <a th:href="@{/itinerary/new}" class="btn-primary">
                <i class="fa-solid fa-plus"></i> 建立新行程
            </a>
        </div>

        <!-- Stats Cards：即時計算目前真實資料數量 (見 AgencyController.dashboard())
             卡片內順序: 圖示 → 行程名稱 → 數量, 一橫排排列 -->
        <div class="hero-stats">
            <div class="stat-card">
                <div class="stat-icon"><i class="fa-solid fa-suitcase"></i></div>
                <span class="stat-title">進行中行程</span>
                <span class="stat-number" th:text="${ongoingCount}">0</span>
            </div>
            <div class="stat-card">
                <div class="stat-icon"><i class="fa-solid fa-circle-check"></i></div>
                <span class="stat-title">已完成行程</span>
                <span class="stat-number" th:text="${completedCount}">0</span>
            </div>
            <div class="stat-card">
                <div class="stat-icon"><i class="fa-regular fa-image"></i></div>
                <span class="stat-title">素材庫圖片</span>
                <span class="stat-number" th:text="${imageCount}">0</span>
            </div>
        </div>
    </div>

    <!-- Section Title & AI Button -->
    <div class="section-header">
        <div class="section-title">
            <i class="fa-solid fa-suitcase"></i> 我的行程
        </div>
        <a th:href="@{/ai-import/new}" class="btn-ai">
            <i class="fa-solid fa-wand-magic-sparkles"></i> AI 行程拆解分析
        </a>
    </div>

    <!-- Itinerary Table -->
    <div class="table-container">
        <table th:if="${!itineraries.isEmpty()}">
            <thead>
            <tr>
                <th>行程名稱</th>
                <th>國家</th>
                <th>天數</th>
                <th>出發日期</th>
                <th>狀態</th>
                <th>操作</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="it : ${itineraries}">
                <td>
                    <div class="itinerary-cell">
                        <span th:text="${it.title}"></span>
                    </div>
                </td>
                <td th:text="${it.country} + (${it.region} != null ? ' / ' + ${it.region} : '')"></td>
                <td th:text="${it.daysCount} + ' 天'"></td>
                <td>
                    <i class="fa-regular fa-calendar" style="color: #94a3b8; margin-right: 4px;"></i>
                    <span th:text="${it.startDate}"></span>
                </td>
                <td>
                    <!-- 狀態 Badge: draft(進行中/草稿) 顯示藍色, 其他 (completed 及舊資料的 confirmed/departed) 一律當作已完成顯示綠色 -->
                    <span th:if="${it.status == null or it.status == 'draft'}" class="status-badge status-draft">草稿</span>
                    <span th:if="${it.status != null and it.status != 'draft'}" class="status-badge status-confirmed">已完成</span>
                </td>
                <td>
                    <div class="actions">
                        <a th:href="@{'/itinerary/' + ${it.ITID} + '/board'}" class="btn-text">編輯行程</a>

                        <a th:href="@{'/itinerary/' + ${it.ITID} + '/quick-quote'}" class="btn-text" style="color:#8b5cf6;">編輯報價</a>

                        <form method="post" th:action="@{'/itinerary/' + ${it.ITID} + '/delete'}" style="margin:0;"
                              onsubmit="return confirm('確定要刪除「' + this.dataset.title + '」嗎？');"
                              th:attr="data-title=${it.title}">
                            <button type="submit" class="btn-icon" title="刪除行程">
                                <i class="fa-solid fa-trash-can"></i>
                            </button>
                        </form>
                    </div>
                </td>
            </tr>
            </tbody>
        </table>

        <div th:if="${itineraries.isEmpty()}" style="padding: 40px; text-align: center; color: var(--text-gray);">
            目前還沒有任何行程，點擊上方「＋ 建立新行程」開始規劃。
        </div>

        <div class="table-footer" th:if="${!itineraries.isEmpty()}">
            <a href="#">查看全部行程 <i class="fa-solid fa-chevron-down" style="margin-left: 4px;"></i></a>
        </div>
    </div>

</main>

<script th:inline="javascript">
    // 素材庫圖片輪播 (Hero Banner 背景)
    // heroImageUrls 由後端從這個旅行社的「圖片資源庫」隨機挑幾張傳過來；
    // 如果旅行社還沒上傳過任何圖片，就 fallback 回原本的預設底圖。
    const heroImageUrls = /*[[${heroImageUrls}]]*/ [];
    const heroFallbackImage = 'https://images.unsplash.com/photo-1469854523086-cc02fe5d8800?q=80&w=2021&auto=format&fit=crop';

    (function initHeroCarousel() {
        const layers = [document.getElementById('heroBgLayer0'), document.getElementById('heroBgLayer1')];
        if (!layers[0] || !layers[1]) return;

        const images = (heroImageUrls && heroImageUrls.length > 0) ? heroImageUrls : [heroFallbackImage];
        let activeLayerIdx = 0;
        let current = 0;

        layers[0].style.backgroundImage = `url('${images[0]}')`;

        if (images.length <= 1) return; // 只有一張圖就不用跑輪播

        setInterval(() => {
            current = (current + 1) % images.length;
            const nextLayerIdx = 1 - activeLayerIdx;
            layers[nextLayerIdx].style.backgroundImage = `url('${images[current]}')`;
            layers[nextLayerIdx].classList.add('active');
            layers[activeLayerIdx].classList.remove('active');
            activeLayerIdx = nextLayerIdx;
        }, 5000); // 每 5 秒淡入下一張
    })();
</script>

</body>
</html>
