<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>登入 - TRAVELER EASY GATE</title>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --primary-blue: #2563eb;
            --bg-gray: #f8fafc;
            --text-dark: #1e293b;
            --text-gray: #64748b;
            --border-color: #e2e8f0;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'Noto Sans TC', sans-serif; background-color: var(--bg-gray); color: var(--text-dark);
            display: flex; align-items: center; justify-content: center; min-height: 100vh; padding: 24px;
        }
        .login-card {
            width: 100%; max-width: 440px; background: #fff;
            border: 1px solid var(--border-color); border-radius: 16px; padding: 36px 32px;
            box-shadow: 0 4px 6px -1px rgba(0,0,0,0.03);
        }
        .logo { font-size: 22px; font-weight: 700; color: var(--primary-blue); display: flex; align-items: center; justify-content: center; gap: 10px; margin-bottom: 24px; }
        .logo span { font-size: 11px; color: var(--text-gray); display: block; font-weight: 400; letter-spacing: 1px; }

        .alert-error {
            background: #fef2f2; border: 1px solid #fecaca; color: #b91c1c;
            padding: 10px 14px; border-radius: 8px; font-size: 13px; margin-bottom: 16px;
            display: flex; align-items: center; gap: 8px;
        }

        .form-group { margin-bottom: 16px; }
        .form-label { display: block; font-size: 13px; font-weight: 600; color: #334155; margin-bottom: 6px; }
        .form-control {
            width: 100%; padding: 11px 14px; font-size: 14px;
            border: 1px solid var(--border-color); border-radius: 8px; outline: none;
        }
        .form-control:focus { border-color: var(--primary-blue); box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.1); }
        .btn-submit {
            width: 100%; padding: 12px; background: var(--primary-blue); color: #fff;
            border: none; border-radius: 8px; font-size: 15px; font-weight: 600; cursor: pointer; margin-top: 10px;
            transition: background 0.15s;
        }
        .btn-submit:hover { background: #1d4ed8; }
        .footer-text { text-align: center; margin-top: 20px; font-size: 13.5px; color: var(--text-gray); }
        .footer-text a { color: var(--primary-blue); font-weight: 600; text-decoration: none; }
        .footer-text a:hover { text-decoration: underline; }
    </style>
</head>
<body>

<div class="login-card">
    <div class="logo">
        <i class="fa-regular fa-compass"></i>
        <div>
            TEG
            <span>TRAVELER EASY GATE</span>
        </div>
    </div>

    <!-- 錯誤提示 -->
    <div th:if="${param.error}" class="alert-error">
        <i class="fa-solid fa-circle-exclamation"></i>
        <span>帳號或密碼錯誤，請重新輸入。</span>
    </div>

    <form method="post" th:action="@{/login}">
        <div class="form-group">
            <label class="form-label">帳號 / Email</label>
            <input type="text" name="account" class="form-control" placeholder="請輸入登入帳號" required />
        </div>
        <div class="form-group">
            <label class="form-label">密碼</label>
            <input type="password" name="pw" class="form-control" placeholder="請輸入密碼" required />
        </div>
        <button type="submit" class="btn-submit">登入系統</button>
    </form>

    <div class="footer-text">
        還沒有旅行社帳號？ <a th:href="@{/register}">立即註冊</a>
    </div>
</div>

</body>
</html>
