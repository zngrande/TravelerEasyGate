<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>登入 - Useful Travel</title>
</head>
<body>
    <h1>Useful Travel 登入</h1>
    <form method="post" th:action="@{/login}">
        <div>
            <label>帳號</label>
            <input type="text" name="account" required />
        </div>
        <div>
            <label>密碼</label>
            <input type="password" name="pw" required />
        </div>
        <button type="submit">登入</button>
    </form>
    <p><a th:href="@{/register}">還沒有旅行社帳號？註冊</a></p>
</body>
</html>
