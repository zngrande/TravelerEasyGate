<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>新增景點資料 - Useful Travel</title>
    <style>
        body { font-family: "Microsoft JhengHei", sans-serif; max-width: 480px; margin: 60px auto; }
        label { display: block; margin-top: 12px; font-weight: bold; }
        input, select, textarea { width: 100%; padding: 8px; margin-top: 4px; box-sizing: border-box; }
        button { margin-top: 20px; padding: 10px 20px; }
        a.back { display: inline-block; margin-bottom: 20px; }
        .row { display: flex; gap: 10px; }
        .row > div { flex: 1; }
    </style>
</head>
<body>
    <a class="back" th:href="@{/poi}">← 返回資料庫列表</a>
    <h1>新增景點 / 餐廳 / 飯店資料</h1>
    <form method="post" th:action="@{/poi/new}">
        <label>類型</label>
        <select name="category" required>
            <option value="attraction">景點</option>
            <option value="restaurant">餐廳</option>
            <option value="hotel">飯店</option>
            <option value="rest_stop">休息站</option>
        </select>

        <label>名稱</label>
        <input type="text" name="name" required />

        <div class="row">
            <div>
                <label>國家</label>
                <input type="text" name="country" />
            </div>
            <div>
                <label>城市</label>
                <input type="text" name="city" />
            </div>
        </div>

        <label>地址</label>
        <input type="text" name="address" />

        <div class="row">
            <div>
                <label>緯度 (latitude，選填)</label>
                <input type="number" step="0.0000001" name="latitude" placeholder="留空會自動查詢" />
            </div>
            <div>
                <label>經度 (longitude，選填)</label>
                <input type="number" step="0.0000001" name="longitude" placeholder="留空會自動查詢" />
            </div>
        </div>
        <div style="color:#a16207;font-size:12px;margin-top:-8px;">經緯度留空的話，系統會自動用名稱+城市+國家查詢地理座標（需要設定 Google Maps API Key）。</div>

        <label>建議停留時間（分鐘）</label>
        <input type="number" name="suggestedStayMin" value="60" />

        <label>介紹說明</label>
        <textarea name="description" rows="4"></textarea>

        <div style="background:#fefce8;border:1px solid #fde047;border-radius:8px;padding:16px;margin-top:16px;">
            <h3 style="margin-top:0;color:#854d0e;">💰 公司專屬資源庫（選填）</h3>
            <div class="row">
                <div>
                    <label>成本價</label>
                    <input type="number" step="0.01" name="costPrice" placeholder="跟供應商談的價格" />
                </div>
                <div>
                    <label>同行價 / 建議售價</label>
                    <input type="number" step="0.01" name="agencyPrice" />
                </div>
            </div>
            <label>供應商窗口</label>
            <input type="text" name="supplierContact" placeholder="例：陳小姐 0912-345-678" />
            <label>合作備註</label>
            <textarea name="supplierNotes" rows="2"></textarea>
        </div>

        <button type="submit">儲存</button>
    </form>
</body>
</html>
