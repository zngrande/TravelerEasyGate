<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>編輯景點 - Useful Travel</title>
    <style>
        body { font-family: "Microsoft JhengHei", sans-serif; max-width: 640px; margin: 40px auto; }
        label { display: block; margin-top: 12px; font-weight: bold; }
        input, select, textarea { width: 100%; padding: 8px; margin-top: 4px; box-sizing: border-box; }
        button { margin-top: 20px; padding: 10px 20px; background: #2563eb; color: #fff; border: none; border-radius: 6px; cursor: pointer; }
        a.back { display: inline-block; margin-bottom: 20px; }
        .row { display: flex; gap: 10px; }
        .row > div { flex: 1; }
        h2 { margin-top: 40px; border-top: 1px solid #e2e8f0; padding-top: 20px; }
        section.resource { background: #fefce8; border: 1px solid #fde047; border-radius: 8px; padding: 16px; margin-top: 20px; }
        section.resource h3 { margin-top: 0; color: #854d0e; }
        .log-item { border-bottom: 1px solid #f1f5f9; padding: 8px 0; font-size: 13px; }
        .log-item .date { color: #94a3b8; margin-right: 8px; }
        .log-form { display: flex; gap: 8px; margin-top: 12px; }
        .log-form input[type="text"] { flex: 1; }
        .log-form button { margin-top: 0; padding: 8px 14px; }
        .delete-btn { background: #ef4444; margin-left: 10px; }
        .hint { color: #a16207; font-size: 12px; margin-top: 6px; }
    </style>
</head>
<body>
    <a class="back" th:href="@{/poi}">← 返回資料庫列表</a>
    <h1>編輯景點 / 餐廳 / 飯店</h1>

    <form method="post" th:action="@{'/poi/' + ${poi.PID} + '/edit'}">
        <label>類型</label>
        <select name="category" required>
            <option value="attraction" th:selected="${poi.category == 'attraction'}">景點</option>
            <option value="restaurant" th:selected="${poi.category == 'restaurant'}">餐廳</option>
            <option value="hotel" th:selected="${poi.category == 'hotel'}">飯店</option>
            <option value="rest_stop" th:selected="${poi.category == 'rest_stop'}">休息站</option>
        </select>

        <label>名稱</label>
        <input type="text" name="name" th:value="${poi.name}" required />

        <div class="row">
            <div>
                <label>國家</label>
                <input type="text" name="country" th:value="${poi.country}" />
            </div>
            <div>
                <label>城市</label>
                <input type="text" name="city" th:value="${poi.city}" />
            </div>
        </div>

        <label>地址</label>
        <input type="text" name="address" th:value="${poi.address}" />

        <div class="row">
            <div>
                <label>緯度 (latitude)</label>
                <input type="number" step="0.0000001" name="latitude" th:value="${poi.latitude}" />
            </div>
            <div>
                <label>經度 (longitude)</label>
                <input type="number" step="0.0000001" name="longitude" th:value="${poi.longitude}" />
            </div>
        </div>
        <div class="hint">經緯度留空存檔的話，系統會自動用名稱+城市+國家重新查一次地理座標。</div>

        <label>建議停留時間（分鐘）</label>
        <input type="number" name="suggestedStayMin" th:value="${poi.suggestedStayMin}" />

        <label>介紹說明</label>
        <textarea name="description" rows="3" th:text="${poi.description}"></textarea>

        <section class="resource">
            <h3>💰 公司專屬資源庫</h3>
            <div class="row">
                <div>
                    <label>成本價</label>
                    <input type="number" step="0.01" name="costPrice" th:value="${poi.costPrice}" placeholder="跟供應商談的價格" />
                </div>
                <div>
                    <label>同行價 / 建議售價</label>
                    <input type="number" step="0.01" name="agencyPrice" th:value="${poi.agencyPrice}" />
                </div>
            </div>
            <label>供應商窗口</label>
            <input type="text" name="supplierContact" th:value="${poi.supplierContact}" placeholder="例：陳小姐 0912-345-678 / LINE ID" />
            <label>合作備註</label>
            <textarea name="supplierNotes" rows="2" th:text="${poi.supplierNotes}" placeholder="例：付款方式、取消政策等"></textarea>
        </section>

        <button type="submit">儲存變更</button>
    </form>

    <h2>綁定圖片</h2>
    <div style="display:flex;flex-wrap:wrap;gap:10px;">
        <img th:each="img : ${images}" th:src="@{'/images/' + ${img.IAID} + '/file'}"
             style="width:120px;height:90px;object-fit:cover;border-radius:6px;border:1px solid #e2e8f0;" />
    </div>
    <p th:if="${images.isEmpty()}" style="color:#94a3b8;font-size:13px;">
        還沒有圖片綁定這個景點。<a th:href="@{/images}">去圖片資源庫</a>上傳或手動綁定。
    </p>

    <h2>合作紀錄</h2>
    <div th:each="log : ${logs}" class="log-item">
        <span class="date" th:text="${log.logDate}"></span>
        <span th:text="${log.note}"></span>
    </div>
    <p th:if="${logs.isEmpty()}" style="color:#94a3b8;font-size:13px;">還沒有任何合作紀錄。</p>

    <form class="log-form" method="post" th:action="@{'/poi/' + ${poi.PID} + '/cooperation-log'}">
        <input type="date" name="logDate" />
        <input type="text" name="note" placeholder="例：2026年報價調漲、窗口換人了..." required />
        <button type="submit">＋ 新增紀錄</button>
    </form>

    <form method="post" th:action="@{'/poi/' + ${poi.PID} + '/delete'}"
          onsubmit="return confirm('確定要刪除這筆資料嗎？此動作無法復原。');" style="margin-top:30px;">
        <button type="submit" class="delete-btn">刪除這筆景點資料</button>
    </form>
</body>
</html>
