spring.datasource.url=jdbc:mysql://localhost:3306/traveler_easy_gate?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Taipei
spring.datasource.username=root
spring.datasource.password=

# Anthropic Claude API (AI 行程打碎解析用)
# 建議用環境變數帶入, 不要把 key 直接寫死 commit 進版本控制:
#   Windows: setx ANTHROPIC_API_KEY "sk-ant-xxxx"
# 申請網址: https://console.anthropic.com
anthropic.api.key=${ANTHROPIC_API_KEY:}
anthropic.api.model=claude-sonnet-5

# Google Maps API (地理與路徑智慧引擎: 真實拉車距離/時間、看板地圖、匯出地圖圖片)
# 需要在 Google Cloud Console 啟用: Distance Matrix API, Maps Static API, Maps JavaScript API
# 申請網址: https://console.cloud.google.com/google/maps-apis
# 沒設定的話系統會自動退回用直線距離估算, 不會整個掛掉, 但看板地圖/匯出地圖圖片就不會顯示
google.maps.api.key=${GOOGLE_MAPS_API_KEY:}

spring.jpa.hibernate.ddl-auto=none
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# Flyway: 自動管理資料庫結構變更, 部署/啟動時自動套用 src/main/resources/db/migration/ 裡
# 還沒執行過的 SQL 檔案, 取代「改完程式要記得手動去資料庫跑 SQL, 常常忘記跑」的舊做法。
# 詳細說明跟「怎麼新增一個資料庫變更」的操作方式見 src/main/resources/db/migration/README.md。
#
# baseline-on-migrate + baseline-version=1: 這個專案是中途才導入 Flyway 的, 資料庫在導入的
# 當下已經用專案根目錄 db/ 資料夾裡一堆手動 SQL 檔案跑到某個狀態了——這兩個設定是告訴 Flyway
# 「別想去驗證重跑那些舊檔案, 直接把現在的資料庫狀態當成第 1 版, 從這之後新增的才由你接管」。
# ⚠️ 部署這次更新之前, 一定要先手動執行一次 db/before_flyway_catchup.sql, 確保舊的手動 SQL
# 檔案都補齊了 (不然 Flyway 會誤以為那些「還沒套用的舊變更」也已經包含在 baseline 裡, 永遠不會
# 被執行)。
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1
spring.flyway.baseline-description=Existing schema before Flyway adoption
spring.flyway.locations=classpath:db/migration

# 自訂錯誤頁面: 見 GlobalExceptionHandler.java (攔截 Controller 執行中丟出的例外) +
# templates/error/404.html、error/5xx.html (Spring Boot 內建慣例, 找不到網址對應的處理方式時
# 自動套用, 不用寫程式碼)。沒有另外關閉 server.error.whitelabel.enabled——萬一真的遇到這兩層都沒接住
# 的極端情況, 寧可退回 Spring Boot 內建的 Whitelabel 頁面 (至少還能看、還能動), 也不要因為關掉這個
# 保底機制而讓使用者看到完全空白或壞掉的回應。

# 檔案上傳限制 (AI 行程解析: 上傳 PDF/Word 用)
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=50MB
# Tomcat 預設在超過大小限制時會直接斷線而不是回錯誤頁面, 這裡調成跟上面一致才能讓 Spring 正常攔截並顯示錯誤訊息
server.tomcat.max-swallow-size=50MB
server.tomcat.max-http-form-post-size=50MB

# 圖片資源庫: 圖片實際存放的資料夾 (相對於程式執行的目錄)
# 只適合單機開發/測試, 部署到雲端要換成物件儲存服務 (見 ImageStorageService 介面說明)
app.upload.image-dir=uploads/images

# Thymeleaf
spring.thymeleaf.cache=false
spring.thymeleaf.encoding=UTF-8

# Session timeout
server.servlet.session.timeout=60m

# Turn off the spring boot banner
spring.main.banner-mode=off

# Reduce logging level. Set logging level to warn
logging.level.root=warn

# Add logging configs to display SQL statements
logging.level.org.hibernate.SQL=debug
logging.level.org.hibernate.orm.jdbc.bind=trace

