spring.datasource.url=jdbc:mysql://localhost:3306/traveler_easy_gate?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Taipei
spring.datasource.username=root
spring.datasource.password=

# Anthropic Claude API (AI 行程打碎解析用)
# 建議用環境變數帶入, 不要把 key 直接寫死 commit 進版本控制:
#   Windows: setx ANTHROPIC_API_KEY "sk-ant-xxxx"
# 申請網址: https://console.anthropic.com
anthropic.api.key=${ANTHROPIC_API_KEY:}
anthropic.api.model=claude-sonnet-5

# Google Maps API (地理與路徑智慧引擎: 真實拉車距離/時間、看板地圖、匯出地圖圖片)
# 需要在 Google Cloud Console 啟用: Distance Matrix API, Maps Static API, Maps JavaScript API
# 申請網址: https://console.cloud.google.com/google/maps-apis
# 沒設定的話系統會自動退回用直線距離估算, 不會整個掛掉, 但看板地圖/匯出地圖圖片就不會顯示
google.maps.api.key=${GOOGLE_MAPS_API_KEY:}

spring.jpa.hibernate.ddl-auto=none
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# Flyway: 自動管理資料庫結構變更, 部署/啟動時自動套用 src/main/resources/db/migration/ 裡
# 還沒執行過的 SQL 檔案, 取代「改完程式要記得手動去資料庫跑 SQL, 常常忘記跑」的舊做法。
# 詳細說明跟「怎麼新增一個資料庫變更」的操作方式見 src/main/resources/db/migration/README.md。
#
# baseline-on-migrate + baseline-version=1: 這個專案是中途才導入 Flyway 的, 資料庫在導入的
# 當下已經用專案根目錄 db/ 資料夾裡一堆手動 SQL 檔案跑到某個狀態了——這兩個設定是告訴 Flyway
# 「別想去驗證重跑那些舊檔案, 直接把現在的資料庫狀態當成第 1 版, 從這之後新增的才由你接管」。
# ⚠️ 部署這次更新之前, 一定要先手動執行一次 db/before_flyway_catchup.sql, 確保舊的手動 SQL
# 檔案都補齊了 (不然 Flyway 會誤以為那些「還沒套用的舊變更」也已經包含在 baseline 裡, 永遠不會
# 被執行)。
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1
spring.flyway.baseline-description=Existing schema before Flyway adoption
spring.flyway.locations=classpath:db/migration

# 自訂錯誤頁面: 見 GlobalExceptionHandler.java (攔截 Controller 執行中丟出的例外) +
# templates/error/404.html、error/5xx.html (Spring Boot 內建慣例, 找不到網址對應的處理方式時
# 自動套用, 不用寫程式碼)。沒有另外關閉 server.error.whitelabel.enabled——萬一真的遇到這兩層都沒接住
# 的極端情況, 寧可退回 Spring Boot 內建的 Whitelabel 頁面 (至少還能看、還能動), 也不要因為關掉這個
# 保底機制而讓使用者看到完全空白或壞掉的回應。

# 檔案上傳限制 (AI 行程解析: 上傳 PDF/Word 用)
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=50MB
# Tomcat 預設在超過大小限制時會直接斷線而不是回錯誤頁面, 這裡調成跟上面一致才能讓 Spring 正常攔截並顯示錯誤訊息
server.tomcat.max-swallow-size=50MB
server.tomcat.max-http-form-post-size=50MB

# 圖片資源庫: 圖片實際存放的資料夾 (相對於程式執行的目錄)
# 只適合單機開發/測試, 部署到雲端要換成物件儲存服務 (見 ImageStorageService 介面說明)
app.upload.image-dir=uploads/images

# Thymeleaf
spring.thymeleaf.cache=false
spring.thymeleaf.encoding=UTF-8

# Session timeout
server.servlet.session.timeout=60m

# 使用者反映「點『完成行程』會跳出『標記完成失敗：Failed to fetch』，但『退回草稿』不會；
# 報價單頁面點任何按鈕都會跳出『連線失敗：Failed to fetch』，但動作本身其實都有成功執行」——
# 追查後發現這兩個症狀有一個共同的根因: ItineraryController 的 /complete 跟 QuotationController
# 裡幾乎所有會修改資料的端點 (grep 出來有 71 處), 執行完資料庫寫入之後回傳的都是
# `return "redirect:/xxx";` 這種 Spring 內建的重新導向, 交給 Spring 自己組出一個
# HTTP 302 + Location 標頭給瀏覽器; 唯一一個「不會出現這個錯誤」的 /revert-to-draft,
# 剛好是唯一一個不用 redirect、直接用 @ResponseBody 把結果整包回傳的端點——兩邊的差異
# 剛好就卡在「有沒有經過 redirect」這一步, 高度符合這個根因推論。
# 部署到有反向代理 (edge proxy) 的雲端環境 (例如 Railway) 時, 如果 Spring Boot 不知道
# 自己是「被反向代理架著」, 組 Location 標頭時預設會用它自己看到的內部 host/port (例如
# 容器內部位址), 而不是使用者瀏覽器實際能連到的公開網域; 瀏覽器上的 fetch() 想要跟著這個
# Location 走下一步時, 連到一個瀏覽器根本連不到的內部位址, 就會直接丟出「Failed to fetch」
# 這種網路層級的例外 (不是 res.ok===false 那種「有回應但狀態碼不對」)。因為資料庫的寫入動作
# 是在「回傳 redirect 之前」就已經做完並且成功 commit 了，所以才會出現「跳錯誤訊息、但動作
# 其實都有做成功」這種矛盾的現象。
# 修正: 打開 forward-headers-strategy=framework，讓 Spring Boot (透過 Tomcat) 去讀反向代理
# 附加的 X-Forwarded-Proto / X-Forwarded-Host / X-Forwarded-Port 這些標頭, 用「使用者實際
# 連線的那個公開網址」來組 redirect 的 Location, 而不是用容器內部看到的位址——這樣一次性
# 修掉所有走 redirect: 的端點, 不用一個一個去改 71 個地方的程式碼或前端 fetch 邏輯。
# 本機開發沒有反向代理、也不會帶這些 X-Forwarded-* 標頭，所以這個設定在本機環境下不會有
# 任何影響 (Spring 讀不到對應標頭就照原本行為運作)，只有部署在有反向代理的正式環境時
# 才會實際生效。
# ⚠️ 這是根據程式架構 (redirect: vs @ResponseBody 的行為差異、以及反向代理常見的已知問題模式)
# 推論出的根本原因與修法，目前無法在沒有連上正式站實際測試的情況下 100% 確認——部署後請實際
# 點一次「完成行程」跟報價單上的按鈕，確認不會再跳出「Failed to fetch」訊息。
server.forward-headers-strategy=framework

# Turn off the spring boot banner
spring.main.banner-mode=off

# Reduce logging level. Set logging level to warn
logging.level.root=warn

# Add logging configs to display SQL statements
logging.level.org.hibernate.SQL=debug
logging.level.org.hibernate.orm.jdbc.bind=trace

