<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>建立新行程 - Useful Travel</title>
    <style>
        body { font-family: "Microsoft JhengHei", sans-serif; max-width: 480px; margin: 60px auto; }
        label { display: block; margin-top: 12px; font-weight: bold; }
        input { width: 100%; padding: 8px; margin-top: 4px; box-sizing: border-box; }
        button { margin-top: 20px; padding: 10px 20px; }
        a.back { display: inline-block; margin-bottom: 20px; }
    </style>
</head>
<body>
    <a class="back" th:href="@{/agency/dashboard}">← 返回行程列表</a>
    <h1>建立新行程</h1>
    <form method="post" th:action="@{/itinerary/new}">
        <label>行程名稱</label>
        <input type="text" name="title" placeholder="例：北海道經典六日" required />

        <label>國家 / 地區</label>
        <input type="text" name="country" placeholder="例：日本" required />

        <label>天數</label>
        <input type="number" name="daysCount" min="1" max="30" value="5" required />

        <label>出發日期（選填）</label>
        <input type="date" name="startDate" />

        <button type="submit">建立並開始排行程</button>
    </form>
</body>
</html>
