<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TRAVELER EASY GATE</title>
    <!-- 引入 Google Fonts & FontAwesome 讓圖示與字體更好看 -->
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --primary-blue: #2563eb;
            --primary-purple: #8b5cf6;
            --bg-gray: #f8fafc;
            --text-dark: #1e293b;
            --text-gray: #64748b;
            --border-color: #e2e8f0;
            --sidebar-width: 260px;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'Noto Sans TC', sans-serif; background-color: var(--bg-gray); color: var(--text-dark); display: flex; min-height: 100vh; }
        a { text-decoration: none; color: inherit; }

        /* Sidebar Styles */
        .sidebar { width: var(--sidebar-width); background: #fff; border-right: 1px solid var(--border-color); display: flex; flex-direction: column; padding: 24px 20px; position: fixed; height: 100vh; }
        .logo { font-size: 20px; font-weight: 700; color: var(--primary-blue); margin-bottom: 40px; display: flex; align-items: center; gap: 10px; }
        .logo span { font-size: 10px; color: var(--text-gray); display: block; font-weight: 400; letter-spacing: 1px; }

        .nav-menu { flex: 1; display: flex; flex-direction: column; gap: 8px; }
        .nav-item { display: flex; align-items: center; gap: 12px; padding: 12px 16px; border-radius: 8px; color: var(--text-gray); font-weight: 500; transition: all 0.2s; }
        .nav-item:hover { background: #f1f5f9; color: var(--text-dark); }
        .nav-item.active { background: #eff6ff; color: var(--primary-blue); }

        .help-box { background: #f8fafc; border: 1px solid var(--border-color); border-radius: 8px; padding: 16px; display: flex; align-items: center; justify-content: space-between; font-size: 13px; cursor: pointer; }
        .help-box i { color: var(--primary-blue); font-size: 20px; }

        /* Main Content Styles */
        .main-content { margin-left: var(--sidebar-width); flex: 1; padding: 32px 40px; }

        /* Header */
        .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 24px; }
        .greeting { font-size: 22px; font-weight: 700; }
        .user-profile { display: flex; align-items: center; gap: 10px; background: #fff; padding: 8px 16px; border-radius: 20px; border: 1px solid var(--border-color); font-size: 14px; font-weight: 500; cursor: pointer;}

        /* Hero Banner */
        .hero-banner { background: linear-gradient(rgba(0, 0, 0, 0.4), rgba(0, 0, 0, 0.4)), url('https://images.unsplash.com/photo-1469854523086-cc02fe5d8800?q=80&w=2021&auto=format&fit=crop') center/cover; border-radius: 16px; padding: 48px; color: #fff; margin-bottom: 32px; }
        .hero-banner h2 { font-size: 28px; margin-bottom: 8px; }
        .hero-banner p { font-size: 15px; margin-bottom: 24px; opacity: 0.9; }
        .btn-primary { background: var(--primary-blue); color: #fff; padding: 10px 20px; border-radius: 8px; font-weight: 500; display: inline-flex; align-items: center; gap: 8px; border: none; cursor: pointer; }
        .btn-primary:hover { background: #1d4ed8; }

        /* Section Title & AI Button */
        .section-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; }
        .section-title { font-size: 18px; font-weight: 700; display: flex; align-items: center; gap: 8px; }
        .btn-ai { background: linear-gradient(135deg, #a855f7, #6366f1); color: #fff; padding: 10px 20px; border-radius: 8px; font-weight: 500; display: inline-flex; align-items: center; gap: 8px; }

        /* Stats Cards */
        .stats-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px; margin-bottom: 32px; }
        .stat-card { background: #fff; border: 1px solid var(--border-color); border-radius: 12px; padding: 20px; display: flex; justify-content: space-between; align-items: center; }
        .stat-info { display: flex; flex-direction: column; gap: 4px; }
        .stat-title { font-size: 13px; color: var(--text-gray); }
        .stat-number { font-size: 32px; font-weight: 700; color: var(--primary-blue); }
        .stat-icon { width: 48px; height: 48px; border-radius: 50%; background: #eff6ff; display: flex; align-items: center; justify-content: center; color: var(--primary-blue); font-size: 20px; }
        .stat-card:nth-child(2) .stat-icon { background: #fff7ed; color: #ea580c; }
        .stat-card:nth-child(2) .stat-number { color: #ea580c; }
        .stat-card:nth-child(3) .stat-icon { background: #f3e8ff; color: var(--primary-purple); }
        .stat-card:nth-child(3) .stat-number { color: var(--primary-purple); }

        /* Table Styles */
        .table-container { background: #fff; border: 1px solid var(--border-color); border-radius: 12px; overflow: hidden; }
        table { width: 100%; border-collapse: collapse; text-align: left; }
        th { background: #f8fafc; padding: 16px 20px; font-size: 13px; color: var(--text-gray); font-weight: 500; border-bottom: 1px solid var(--border-color); }
        td { padding: 16px 20px; border-bottom: 1px solid var(--border-color); vertical-align: middle; font-size: 14px; }
        tr:last-child td { border-bottom: none; }

        .itinerary-cell { display: flex; align-items: center; gap: 12px; font-weight: 500; }
        .itinerary-img { width: 48px; height: 36px; border-radius: 6px; object-fit: cover; background: #e2e8f0; }

        .status-badge { padding: 4px 12px; border-radius: 20px; font-size: 12px; font-weight: 500; display: inline-block; }
        /* 簡易狀態顏色對應 (可依照實際需求在 Thymeleaf 中調整) */
        .status-draft { background: #eff6ff; color: var(--primary-blue); }
        .status-pending { background: #fff7ed; color: #ea580c; }
        .status-confirmed { background: #f0fdf4; color: #16a34a; }

        .actions { display: flex; align-items: center; gap: 12px; }
        .btn-text { color: var(--primary-blue); font-weight: 500; font-size: 13px; }
        .btn-icon { color: var(--text-gray); background: none; border: none; cursor: pointer; font-size: 16px; padding: 4px; }
        .btn-icon:hover { color: #ef4444; }

        .table-footer { padding: 16px; text-align: center; border-top: 1px solid var(--border-color); }
        .table-footer a { color: var(--text-gray); font-size: 13px; }

        /* Error Alert */
        .alert { background: #fee2e2; color: #991b1b; padding: 12px 16px; border-radius: 8px; margin-bottom: 24px; font-size: 14px; border: 1px solid #fca5a5; }
    </style>
</head>
<body>

<!-- Sidebar -->
<aside class="sidebar">
    <div class="logo">
        <i class="fa-regular fa-compass"></i>
        <div>
            TEG
            <span>TRAVELER EASY GATE</span>
        </div>
    </div>
    <nav class="nav-menu">
        <a th:href="@{/agency/dashboard}" class="nav-item active">
            <i class="fa-solid fa-suitcase"></i> 行程列表
        </a>
        <a th:href="@{/poi}" class="nav-item">
            <i class="fa-solid fa-location-dot"></i> 景點 / 飯店資料庫
        </a>
        <a th:href="@{/component}" class="nav-item">
            <i class="fa-solid fa-layer-group"></i> 元件庫
        </a>
        <a th:href="@{/images}" class="nav-item">
            <i class="fa-regular fa-image"></i> 圖片資源庫
        </a>
    </nav>
    <div class="help-box">
        <div>
            <div style="font-weight: 700; color: var(--text-dark);">需要協助嗎？</div>
            <div style="color: var(--text-gray); margin-top: 4px;">查看教學文件或聯絡客服</div>
        </div>
        <i class="fa-solid fa-chevron-right" style="font-size: 12px;"></i>
    </div>
    <div class="user-profile">
        <i class="fa-solid fa-circle-user" style="color: #cbd5e1; font-size: 24px;"></i>
        <span th:text="${name}">使用者名稱</span>
        <a th:href="@{/logout}" style="margin-left: 8px; color: var(--text-gray);"><i class="fa-solid fa-sign-out-alt"></i></a>
    </div>
</aside>

<!-- Main Content -->
<main class="main-content">
    <!-- Header -->
    <header class="header">

    </header>

    <!-- 錯誤訊息提示區 -->
    <div th:if="${deleteError}" class="alert" th:text="${deleteError}"></div>

    <!-- Hero Banner -->
    <div class="hero-banner">
        <h2>讓每一段旅程，都清楚而精彩</h2>
        <p>專業的行程管理工具，讓規劃更高效，執行更順暢。</p>
        <a th:href="@{/itinerary/new}" class="btn-primary">
            <i class="fa-solid fa-plus"></i> 建立新行程
        </a>
    </div>

    <!-- Section Title & AI Button -->
    <div class="section-header">
        <div class="section-title">
            <i class="fa-solid fa-suitcase"></i> 我的行程
        </div>
        <a th:href="@{/ai-import/new}" class="btn-ai">
            <i class="fa-solid fa-wand-magic-sparkles"></i> AI 行程拆解分析
        </a>
    </div>

    <!-- Stats Cards (此區塊若無後端資料，目前先以靜態展示) -->
    <div class="stats-grid">
        <div class="stat-card">
            <div class="stat-info">
                <span class="stat-title">進行中的行程</span>
                <span class="stat-number">06</span>
            </div>
            <div class="stat-icon"><i class="fa-solid fa-suitcase"></i></div>
        </div>
        <div class="stat-card">
            <div class="stat-info">
                <span class="stat-title">待確認項目</span>
                <span class="stat-number">12</span>
            </div>
            <div class="stat-icon"><i class="fa-regular fa-clipboard"></i></div>
        </div>
        <div class="stat-card">
            <div class="stat-info">
                <span class="stat-title">素材庫圖片</span>
                <span class="stat-number">248</span>
            </div>
            <div class="stat-icon"><i class="fa-regular fa-image"></i></div>
        </div>
    </div>

    <!-- Itinerary Table -->
    <div class="table-container">
        <table th:if="${!itineraries.isEmpty()}">
            <thead>
            <tr>
                <th>行程名稱</th>
                <th>國家</th>
                <th>天數</th>
                <th>出發日期</th>
                <th>狀態</th>
                <th>操作</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="it : ${itineraries}">
                <td>
                    <div class="itinerary-cell">
                        <!-- 縮圖預設使用 placeholder，若資料庫有圖片網址可替換 src -->
                        <img src="https://via.placeholder.com/48x36/e2e8f0/94a3b8?text=Img" class="itinerary-img" alt="cover">
                        <span th:text="${it.title}"></span>
                    </div>
                </td>
                <td th:text="${it.country} + (${it.region} != null ? ' / ' + ${it.region} : '')"></td>
                <td th:text="${it.daysCount} + ' 天'"></td>
                <td>
                    <i class="fa-regular fa-calendar" style="color: #94a3b8; margin-right: 4px;"></i>
                    <span th:text="${it.startDate}"></span>
                </td>
                <td>
                    <!-- 狀態 Badge，可依據 status 值給予不同 class -->
                    <span class="status-badge status-draft" th:text="${it.status}"></span>
                </td>
                <td>
                    <div class="actions">
                        <a th:href="@{'/itinerary/' + ${it.ITID} + '/board'}" class="btn-text">編輯行程</a>

                        <form method="post" th:action="@{'/itinerary/' + ${it.ITID} + '/delete'}" style="margin:0;"
                              onsubmit="return confirm('確定要刪除「' + this.dataset.title + '」嗎？');"
                              th:attr="data-title=${it.title}">
                            <button type="submit" class="btn-icon" title="刪除行程">
                                <i class="fa-solid fa-trash-can"></i>
                            </button>
                        </form>
                    </div>
                </td>
            </tr>
            </tbody>
        </table>

        <div th:if="${itineraries.isEmpty()}" style="padding: 40px; text-align: center; color: var(--text-gray);">
            目前還沒有任何行程，點擊上方「＋ 建立新行程」開始規劃。
        </div>

        <div class="table-footer" th:if="${!itineraries.isEmpty()}">
            <a href="#">查看全部行程 <i class="fa-solid fa-chevron-down" style="margin-left: 4px;"></i></a>
        </div>
    </div>

</main>

</body>
</html>
